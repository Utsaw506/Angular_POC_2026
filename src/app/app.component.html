<div class="app-layout" [class.sidebar-open]="sidebarOpen">

  <aside class="sidebar">

    <div class="brand">
      <div class="logo" title="Angular 18 POC">A18</div>

      <div class="title" *ngIf="sidebarOpen">
        <h3>Angular 18 POC</h3>
        <p>Demo App</p>
      </div>
    </div>

    <nav class="menu">

      <button class="menu-item" [class.active]="selectedPage === 'current'" (click)="openPage('current')"
        [attr.title]="!sidebarOpen ? 'Image Editor Current' : null">

        <span class="icon">🔗</span>

        <span class="text" *ngIf="sidebarOpen">
          Image Editor Current
        </span>
      </button>

      <button class="menu-item" [class.active]="selectedPage === 'enhancement'" (click)="openPage('enhancement')"
        [attr.title]="!sidebarOpen ? 'Image Editor Enhancement' : null">

        <span class="icon">🧷</span>

        <span class="text" *ngIf="sidebarOpen">
          <!-- Attachment File Enhancement -->
         Image Editor Enhancement
        </span>
      </button>

    </nav>

    <div class="footer">
      <small *ngIf="sidebarOpen">© 2026 - POC</small>
    </div>

  </aside>

  <div class="backdrop" *ngIf="sidebarOpen" (click)="sidebarOpen=false"></div>

  <main class="content">

    <header class="topbar">

      <button class="hamburger" (click)="toggleSidebar()" title="Toggle Menu">
        ☰
      </button>

      <h2>{{ pageTitle }}</h2>

      <span class="badge">Angular 18</span>
    </header>

    <section class="page">

      <app-attachment-file-current *ngIf="selectedPage === 'current'">
      </app-attachment-file-current>

      <app-attachment-file-enhancement *ngIf="selectedPage === 'enhancement'">
      </app-attachment-file-enhancement>

    </section>

  </main>
</div>
